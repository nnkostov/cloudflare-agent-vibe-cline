name = "github-ai-intelligence"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Dashboard static files (Workers Static Assets). Unknown paths fall back
# to index.html for the React router; /api/* always runs the Worker.
[assets]
directory = "./dashboard/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Durable Objects binding
[[durable_objects.bindings]]
name = "GITHUB_AGENT"
class_name = "GitHubAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GitHubAgent"]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "github-intelligence"
database_id = "90ad28ff-c07b-41c3-90bf-44da6f903687"

# R2 Storage binding
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "github-analyses"

# Environment variables (will be set via wrangler secret)
[vars]
# GITHUB_TOKEN and ANTHROPIC_API_KEY will be set as secrets
ENVIRONMENT = "production"

# Development settings
[env.development]
vars = { ENVIRONMENT = "development" }

# Cron triggers for automated scanning
[triggers]
crons = [
  "0 0,1,3-13,15-23 * * *",  # Hourly scan only (skips 02:00/14:00, covered by the full sweep)
  "15,45 * * * *",           # Every 30 min (offset): analysis-only batch runs
  "0 2,14 * * *"             # Twice daily at 2 AM and 2 PM: full sweep (scan + analysis)
]

# Observability configuration
[observability.logs]
enabled = true

# Tail consumers configuration
[[tail_consumers]]
service = "github-ai-intelligence-tail"
